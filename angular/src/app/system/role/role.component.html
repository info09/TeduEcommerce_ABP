<div class="animated fadeIn">
  <p-panel #pnl [style]="{ 'margin-bottom': '10px' }">
    <p-header> Quản lý quyền </p-header>
    <div class="grid">
      <div class="col-6">
        <button
          pButton
          type="button"
          (click)="showAddModal()"
          icon="fa fa-plus"
          iconPos="left"
          label="Thêm"
        ></button>
        <button
          pButton
          type="button"
          (click)="showEditModal()"
          *ngIf="selectedItems.length == 1"
          class="ml-1 p-button-help"
          icon="fa fa-minus"
          iconPos="left"
          label="Sửa"
        ></button>
        <button
          pButton
          type="button"
          (click)="deleteItems()"
          *ngIf="selectedItems.length > 0"
          class="ml-1 p-button-danger"
          icon="fa fa-trash"
          iconPos="left"
          label="xóa"
        ></button>
      </div>
      <div class="col-6">
        <div class="formgroup-inline">
          <div class="field">
            <input
              id="txtKeyword"
              pInputText
              (keyup.enter)="loadData()"
              [(ngModel)]="keyword"
              placeholder="Nhập tên nhóm..."
              type="text"
            />
          </div>
          <button type="button" pButton (click)="loadData()">Tìm</button>
        </div>
      </div>
    </div>
    <p-table #pnl [value]="items" [(selection)]="selectedItems" selectionMode="multiple">
      <ng-template pTemplate="header">
        <tr>
          <th style="width: 10px">
            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
          </th>
          <th>Tên</th>
          <th>Mô tả</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr [pSelectableRow]="row">
          <td style="width: 10px">
            <span class="ui-column-title"></span>
            <p-tableCheckbox [value]="row"></p-tableCheckbox>
          </td>
          <td>{{ row.name }}</td>
          <td>{{ row.description }}</td>
          <td>
            <button pButton (click)="showPermissionModal(row.id, row.name)">Phân quyền</button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="summary">
        <div style="text-align: left">Tổng số: {{ totalCount | number }}</div>
      </ng-template>
    </p-table>

    <p-paginator
      [rows]="maxResultCount"
      [totalRecords]="totalCount"
      (onPageChange)="pageChanged($event)"
      [rowsPerPageOptions]="[10, 20, 50, 100]"
    ></p-paginator>

    <p-blockUI [target]="pnl" [blocked]="blockedPanel">
      <p-progressSpinner
        [style]="{ width: '100px', height: '100px', position: 'absolute', top: '25%', left: '50%' }"
        strokeWidth="2"
        animationDuration=".5s"
      ></p-progressSpinner>
    </p-blockUI>
  </p-panel>
</div>
